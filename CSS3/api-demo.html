<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1.0">
  <meta name="robots" content="noindex,nofollow">
  <meta name="theme-color" content="#07101c">
  <title>Vertex AI</title>
  <link rel="icon" type="image/png" href="img/logo3.png">
  <link rel="stylesheet" href="api-demo.css?v=6">
  <script src="auth.js"></script>
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="top-actions">
        <div class="online-pill" dir="ltr"><span></span>API Online</div>
      </div>

      <a class="brand" href="ai.html" aria-label="Vertex AI" dir="ltr">
        <div class="brand-copy">
          <strong>Vertex AI</strong>
          <span>Powered by Vertex Systems AI</span>
        </div>
        <div class="brand-mark">V</div>
      </a>
    </header>

    <main class="chat-shell">
      <section id="welcome" class="welcome">
        <div class="core-wrap" aria-hidden="true">
          <div class="core-glow"></div>
          <div class="core">V</div>
        </div>

        <div class="welcome-label" dir="ltr">VERTEX INTELLIGENCE</div>
        <h1>وش تبغى تسأل <span dir="ltr">Vertex AI</span>؟</h1>
        <p>اكتب سؤالك مباشرة، بدون ربط مفتاح أو إعدادات إضافية.</p>

        <div class="suggestions">
          <button type="button" data-prompt="اكتب لي فكرة مشروع تقني جديدة"><span>💡</span> فكرة مشروع</button>
          <button type="button" data-prompt="اشرح لي الذكاء الاصطناعي بطريقة بسيطة"><span>🧠</span> اشرح لي</button>
          <button type="button" data-prompt="ساعدني أكتب كود JavaScript بسيط"><span>💻</span> برمجة</button>
        </div>
      </section>

      <section id="messages" class="messages" aria-live="polite"></section>
    </main>

    <div class="composer-area">
      <div class="composer">
        <textarea id="promptInput" rows="1" placeholder="اكتب رسالتك إلى Vertex AI..." maxlength="12000"></textarea>
        <button id="sendBtn" class="send-btn" type="button" aria-label="إرسال">↑</button>
      </div>
      <div class="composer-note">Enter للإرسال • Shift + Enter لسطر جديد</div>
    </div>
  </div>

  <script src="api-demo.js?v=6"></script>
</body>
</html>
