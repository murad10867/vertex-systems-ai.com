name: Connect Vertex AI backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Patch Vertex AI frontend
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64

          ai = Path('CSS3/ai.js')
          text = ai.read_text(encoding='utf-8')

          old = "    const reply =\n        generateLocalReply(\n            text\n        );"
          new = "    let reply;\n\n    try {\n        reply = await generateAIReply(text);\n    }\n    catch (error) {\n        console.error(\"Vertex AI request failed:\", error);\n        reply = getVertexAIErrorMessage(error);\n    }"

          if old not in text:
              raise SystemExit('local reply call not found')
          text = text.replace(old, new, 1)

          helper_b64 = '"OwogICAgfQogICAgcmV0dXJuICLvuI/wn5qA2YUg2YrYqtmFINin2YTYrdmI2YQg2LnZhNmJINix2K8g2YXZhiBWZXJ0ZXggQUkg2KfZhNii2YYuINit2KfZiNmEINmF2LHYqSDYo9iu2LHZiS4iOwp9Cgo='
          helper = base64.b64decode(helper_b64 + ('=' * (-len(helper_b64) % 4))).decode('utf-8')
          marker = "// ==========================================\n// Local AI\n// ==========================================\n"
          if 'async function generateAIReply' not in text:
              if marker not in text:
                  raise SystemExit('Local AI marker not found')
              text = text.replace(marker, helper + marker, 1)
          ai.write_text(text, encoding='utf-8')

          html = Path('CSS3/ai.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace('اختر طول الردود المحلية.', 'اختر طول ردود Vertex AI.')
          h = h.replace('Vertex AI المحلي قد يقدم معلومات غير دقيقة.', 'قد يقدم Vertex AI معلومات غير دقيقة. تحقق من المعلومات المهمة.')
          html.write_text(h, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/ai.js CSS3/ai.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Connect Vertex AI to authenticated Supabase backend"
            git push
          fi
