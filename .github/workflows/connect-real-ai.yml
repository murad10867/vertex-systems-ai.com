name: Connect Vertex AI backend

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  connect:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Connect Vertex AI to Supabase Edge Function
        run: |
          python - <<'PY'
          from pathlib import Path

          ai = Path('CSS3/ai.js')
          text = ai.read_text(encoding='utf-8')

          old = '''    const reply =\n        generateLocalReply(\n            text\n        );'''

          new = '''    let reply;\n\n    try {\n        reply = await generateAIReply(text);\n    }\n    catch (error) {\n        console.error("Vertex AI request failed:", error);\n        reply = getVertexAIErrorMessage(error);\n    }'''

          if old not in text:
              raise SystemExit('Could not find local reply call')
          text = text.replace(old, new, 1)

          marker = '''// ==========================================\n// Local AI\n// ==========================================\n'''

          helper = r'''// ==========================================
// Real Vertex AI (Supabase Edge Function)
// ==========================================

async function generateAIReply(userText) {

    let client = null;

    if (
        window.VertexAuth &&
        typeof window.VertexAuth.ensureSupabase === "function"
    ) {
        client = await window.VertexAuth.ensureSupabase();
    }
    else if (
        typeof supabaseClient !== "undefined" &&
        supabaseClient &&
        supabaseClient.functions
    ) {
        client = supabaseClient;
    }

    if (!client || !client.functions) {
        throw new Error("supabase_not_ready");
    }

    const conversation = getActiveConversation();

    const messages = conversation
        ? conversation.messages.map(function (message) {
            return {
                role: message.role,
                content: message.content
            };
        })
        : [
            {
                role: "user",
                content: userText
            }
        ];

    const memoryPayload = settings.memoryEnabled
        ? memories.slice(0, 20).map(function (memory) {
            return { content: memory.content };
        })
        : [];

    const { data, error } = await client.functions.invoke(
        "vertex-ai",
        {
            body: {
                messages: messages,
                memories: memoryPayload,
                assistantName: settings.assistantName
            }
        }
    );

    if (error) {
        throw error;
    }

    if (data && data.code === "missing_openai_key") {
        const configError = new Error("missing_openai_key");
        configError.code = "missing_openai_key";
        throw configError;
    }

    if (!data || typeof data.reply !== "string" || !data.reply.trim()) {
        throw new Error("empty_ai_reply");
    }

    return applyResponseStyle(data.reply.trim());
}

function getVertexAIErrorMessage(error) {

    const message = String(
        error && (error.code || error.message)
            ? (error.code || error.message)
            : error || ""
    ).toLowerCase();

    if (message.includes("missing_openai_key")) {
        return "⚙️ Vertex AI جاهز للربط، لكن بقي إضافة مفتاح OpenAI الآمن في Supabase.";
    }

    if (
        message.includes("jwt") ||
        message.includes("401") ||
        message.includes("unauthorized")
    ) {
        return "🔐 انتهت جلسة الدخول أو لم يتم التحقق منها. سجّل الدخول من جديد ثم حاول مرة أخرى.";
    }

    if (
        message.includes("failed to fetch") ||
        message.includes("network")
    ) {
        return "🌐 تعذر الاتصال بخدمة Vertex AI. تأكد من الإنترنت ثم حاول مرة أخرى.";
    }

    return "⚠️ تعذر الحصول على رد من Vertex AI الآن. حاول مرة أخرى بعد قليل.";
}

'''

          if 'async function generateAIReply' not in text:
              if marker not in text:
                  raise SystemExit('Could not find Local AI marker')
              text = text.replace(marker, helper + marker, 1)

          ai.write_text(text, encoding='utf-8')

          html = Path('CSS3/ai.html')
          h = html.read_text(encoding='utf-8')
          h = h.replace('اختر طول الردود المحلية.', 'اختر طول ردود Vertex AI.')
          h = h.replace('Vertex AI المحلي قد يقدم معلومات غير دقيقة.', 'قد يقدم Vertex AI معلومات غير دقيقة. تحقق من المعلومات المهمة.')
          html.write_text(h, encoding='utf-8')
          PY

      - name: Commit integration
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/ai.js CSS3/ai.html
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Connect Vertex AI to authenticated Supabase backend"
            git push
          fi
