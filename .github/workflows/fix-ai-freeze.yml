name: Fix Vertex AI chat freeze

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-ai-freeze.mjs
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add CSS3/ai.js
          git diff --cached --quiet || git commit -m "Prevent Vertex AI chat from appearing frozen"
          git push
