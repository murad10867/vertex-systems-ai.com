name: Harden Vertex protected pages

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  harden:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Harden protected pages and SEO basics
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          root = Path('CSS3')

          protected = [
              'dashboard.html', 'projects.html', 'ai.html', 'robots.html',
              'games.html', 'web.html', 'space.html', 'minecraft.html',
              'planets.html', 'stars.html', 'black-holes.html', 'galaxies.html',
              'moons.html', 'exploration.html'
          ]

          noindex = set(protected + ['login.html', 'signup.html', 'check.html'])

          for name in noindex:
              path = root / name
              if not path.exists():
                  continue
              text = path.read_text(encoding='utf-8')
              original = text

              if not re.search(r'<meta\s+name=["\']robots["\']', text, re.I):
                  text = re.sub(
                      r'<head\s*>',
                      '<head>\n    <meta name="robots" content="noindex, nofollow">',
                      text,
                      count=1,
                      flags=re.I
                  )

              if name in protected and not re.search(r'src=["\']auth\.js["\']', text, re.I):
                  text = re.sub(
                      r'</head\s*>',
                      '    <script src="auth.js"></script>\n</head>',
                      text,
                      count=1,
                      flags=re.I
                  )

              if text != original:
                  path.write_text(text, encoding='utf-8')

          # Improve homepage document metadata basics if missing.
          index = root / 'index.html'
          if index.exists():
              text = index.read_text(encoding='utf-8')
              original = text
              if not re.search(r'<meta\s+charset=', text, re.I):
                  text = re.sub(r'<head\s*>', '<head>\n    <meta charset="UTF-8">', text, count=1, flags=re.I)
              if not re.search(r'<meta\s+name=["\']viewport["\']', text, re.I):
                  text = re.sub(r'<head\s*>', '<head>\n    <meta name="viewport" content="width=device-width, initial-scale=1.0">', text, count=1, flags=re.I)
              if text != original:
                  index.write_text(text, encoding='utf-8')

          # Dashboard reads the Supabase user asynchronously. Make it refresh when auth is ready.
          dash = root / 'dashboard.js'
          if dash.exists():
              text = dash.read_text(encoding='utf-8')
              original = text

              text = text.replace(
                  'const currentUser =\n    VertexAuth.getUser();',
                  'let currentUser =\n    VertexAuth.getUser();'
              )

              if 'currentUser =\n        VertexAuth.getUser();' not in text:
                  text = text.replace(
                      'function displayUser() {\n',
                      'function displayUser() {\n\n    currentUser =\n        VertexAuth.getUser();\n',
                      1
                  )

              marker = '// ==========================================\n// تشغيل الصفحة\n// =========================================='
              listener = '''// ==========================================\n// تحديث بيانات المستخدم بعد جاهزية Supabase\n// ==========================================\n\ndocument.addEventListener(\n    "vertex-auth-ready",\n    function (event) {\n        if (event.detail && event.detail.loggedIn) {\n            displayUser();\n        }\n    }\n);\n\n\n'''
              if 'تحديث بيانات المستخدم بعد جاهزية Supabase' not in text and marker in text:
                  text = text.replace(marker, listener + marker, 1)

              if text != original:
                  dash.write_text(text, encoding='utf-8')
          PY

          rm -f .github/workflows/harden-site.yml

      - name: Commit hardening changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Harden protected pages and auth loading"
            git push
          fi
