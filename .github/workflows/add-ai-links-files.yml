name: Add Vertex AI links and files

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/add-ai-links-files.mjs
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add CSS3/ai.js CSS3/ai.css
          git diff --cached --quiet || git commit -m "Add clickable links and downloadable AI files"
          git push
