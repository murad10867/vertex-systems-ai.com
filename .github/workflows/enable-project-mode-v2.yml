name: Enable Vertex Project Mode v2

on:
  push:
    paths:
      - '.github/workflows/enable-project-mode-v2.yml'

permissions:
  contents: write

jobs:
  enable-project-mode-v2:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert Project Mode v2 script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CSS3/ai.html')
          text = path.read_text(encoding='utf-8')
          script = '    <script src="ai-project-mode-v2.js"></script>\n'
          if 'ai-project-mode-v2.js' not in text:
              marker = '    <script src="ai-project-mode.js"></script>\n'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + script)
              else:
                  text = text.replace('</body>', script + '\n</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "Project Mode v2 is already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/ai.html
          git commit -m "Load Vertex Project Mode v2 patch"
          git push
