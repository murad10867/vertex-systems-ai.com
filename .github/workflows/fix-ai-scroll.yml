name: Fix Vertex AI auto-scroll

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: node scripts/fix-ai-scroll.mjs
      - run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add CSS3/ai.js
          git diff --cached --quiet || git commit -m "Allow scrolling up while Vertex AI is replying"
          git push
