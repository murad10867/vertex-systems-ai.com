name: Enable Vertex AI Project Mode

on:
  push:
    paths:
      - '.github/workflows/enable-project-mode.yml'

permissions:
  contents: write

jobs:
  enable-project-mode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert Project Mode script
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CSS3/ai.html')
          text = path.read_text(encoding='utf-8')
          script = '    <script src="ai-project-mode.js"></script>\n'
          if 'ai-project-mode.js' not in text:
              text = text.replace('</body>', script + '\n</body>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "Project Mode is already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/ai.html
          git commit -m "Enable Vertex AI Project Mode"
          git push
