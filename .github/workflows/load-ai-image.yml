name: Load Vertex AI image generation

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add image generation script to AI page
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('CSS3/ai.html')
          text = path.read_text(encoding='utf-8')
          tag = '<script src="ai-image.js"></script>'

          if tag not in text:
              if '</body>' not in text:
                  raise SystemExit('Could not find </body> in CSS3/ai.html')
              text = text.replace('</body>', '    ' + tag + '\n\n</body>', 1)
              path.write_text(text, encoding='utf-8')
          PY
      - name: Commit page update
        run: |
          git config user.name github-actions-bot
          git config user.email github-actions-bot@users.noreply.github.com
          git add CSS3/ai.html
          git diff --cached --quiet || git commit -m "Enable Vertex AI image generation interface"
          git push
