name: Cleanup Vertex filenames

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    if: github.actor != 'github-actions[bot]'
    steps:
      - uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Clean filenames and add manifest
        run: |
          python - <<'PY'
          from pathlib import Path
          import json

          root = Path('CSS3')

          old = root / 'scruipt.js'
          new = root / 'script.js'
          if old.exists() and not new.exists():
              old.rename(new)

          for html in root.glob('*.html'):
              text = html.read_text(encoding='utf-8')
              if 'scruipt.js' in text:
                  text = text.replace('scruipt.js', 'script.js')
              html.write_text(text, encoding='utf-8')

          manifest = {
              'name': 'Vertex Systems AI',
              'short_name': 'Vertex',
              'start_url': '/vertex-systems-ai.com/',
              'scope': '/vertex-systems-ai.com/',
              'display': 'standalone',
              'background_color': '#08111f',
              'theme_color': '#08111f',
              'icons': [
                  {
                      'src': 'img/logo3.png',
                      'sizes': 'any',
                      'type': 'image/png',
                      'purpose': 'any'
                  }
              ]
          }
          (root / 'site.webmanifest').write_text(json.dumps(manifest, ensure_ascii=False, indent=2) + '\n', encoding='utf-8')

          index = root / 'index.html'
          text = index.read_text(encoding='utf-8')
          if 'rel="manifest"' not in text:
              text = text.replace('</head>', '    <link rel="manifest" href="site.webmanifest">\n    <meta name="apple-mobile-web-app-capable" content="yes">\n    <meta name="apple-mobile-web-app-title" content="Vertex">\n</head>', 1)
          index.write_text(text, encoding='utf-8')
          PY

      - name: Commit cleanup
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A CSS3
          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Clean script filename and add web app manifest"
            git push
          fi
