name: Enable Vertex AI Sidebar Fix

on:
  push:
    paths:
      - '.github/workflows/enable-sidebar-fix.yml'

permissions:
  contents: write

jobs:
  enable-sidebar-fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Insert sidebar fix stylesheet
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('CSS3/ai.html')
          text = path.read_text(encoding='utf-8')
          link = '    <link rel="stylesheet" href="ai-sidebar-fix.css">\n'
          if 'ai-sidebar-fix.css' not in text:
              marker = '    <link\n        rel="stylesheet"\n        href="ai.css"\n    >\n'
              if marker in text:
                  text = text.replace(marker, marker + '\n' + link)
              else:
                  text = text.replace('</head>', link + '\n</head>')
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit change
        run: |
          if git diff --quiet; then
            echo "Sidebar fix already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/ai.html
          git commit -m "Enable Vertex AI sidebar conversation fix"
          git push
