name: Update old Vertex URLs

on:
  push:
    branches: ["main"]

permissions:
  contents: write

jobs:
  update-urls:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Replace old public URLs
        shell: python
        run: |
          from pathlib import Path

          old_netlify = "https://vertexsystems-ai" + ".netlify.app"
          old_github_pages = "https://murad10867.github.io/" + "vertex-systems-ai/"
          new_github_pages = "https://murad10867.github.io/" + "vertex-systems-ai.com/"

          text_extensions = {
              ".html", ".htm", ".css", ".js", ".json", ".xml", ".txt",
              ".md", ".yml", ".yaml", ".svg"
          }

          changed = []

          for path in Path(".").rglob("*"):
              if not path.is_file() or ".git" in path.parts:
                  continue
              if path.suffix.lower() not in text_extensions:
                  continue

              try:
                  text = path.read_text(encoding="utf-8")
              except UnicodeDecodeError:
                  continue

              updated = text.replace(old_netlify, new_github_pages.rstrip("/"))
              updated = updated.replace(old_github_pages, new_github_pages)

              if updated != text:
                  path.write_text(updated, encoding="utf-8")
                  changed.append(str(path))

          print("Updated files:", changed)

      - name: Commit replacements
        run: |
          if git diff --quiet; then
            echo "No old URLs found."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Update old site URLs to GitHub Pages"
          git push
