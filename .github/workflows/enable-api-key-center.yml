name: Enable Vertex API Key Center

on:
  push:
    paths:
      - '.github/workflows/enable-api-key-center.yml'

permissions:
  contents: write

jobs:
  enable-api-key-center:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Enable API Key Center
        run: |
          python - <<'PY'
          from pathlib import Path

          ai = Path('CSS3/ai.html')
          text = ai.read_text(encoding='utf-8')
          script = '    <script src="api-key-link.js"></script>\n'
          if 'api-key-link.js' not in text:
              marker = '    <script src="ai-project-mode.js"></script>\n'
              if marker in text:
                  text = text.replace(marker, script + '\n' + marker)
              else:
                  text = text.replace('</body>', script + '\n</body>')
              ai.write_text(text, encoding='utf-8')

          auth = Path('CSS3/auth.js')
          text = auth.read_text(encoding='utf-8')
          if '"api-key.html"' not in text:
              marker = '        "ai.html",\n'
              if marker in text:
                  text = text.replace(marker, marker + '        "api-key.html",\n')
                  auth.write_text(text, encoding='utf-8')
          PY

      - name: Commit changes
        run: |
          if git diff --quiet; then
            echo "API Key Center already enabled."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/ai.html CSS3/auth.js
          git commit -m "Enable Vertex API Key Center"
          git push
