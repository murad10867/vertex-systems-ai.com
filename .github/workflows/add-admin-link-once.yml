name: Add Vertex Admin Link Once

on:
  push:
    paths:
      - '.github/workflows/add-admin-link-once.yml'

permissions:
  contents: write

jobs:
  install-admin-link:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add private admin loader to dashboard
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CSS3/dashboard.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="dashboard-admin-link.js?v=20260905-1"></script>'
          if tag not in s:
              marker = '<script src="site-analytics.js?v=20260905-1"></script>'
              if marker in s:
                  s = s.replace(marker, tag + '\n    ' + marker, 1)
              else:
                  s = s.replace('</body>', '    ' + tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit private admin loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/dashboard.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Show private Vertex Admin link to admins"
            git push
          fi
