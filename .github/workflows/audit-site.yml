name: Audit Vertex site

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check local links and critical setup
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from urllib.parse import urlsplit
          import re
          import sys

          root = Path('CSS3')
          root_abs = root.resolve()
          problems = []
          checked = 0

          class RefParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.refs = []
              def handle_starttag(self, tag, attrs):
                  attrs = dict(attrs)
                  for key in ('href', 'src'):
                      value = attrs.get(key)
                      if value:
                          self.refs.append(value.strip())

          def local_target(page, value):
              if not value or value.startswith(('#', 'data:', 'mailto:', 'tel:', 'javascript:')):
                  return None
              parsed = urlsplit(value)
              if parsed.scheme or parsed.netloc:
                  return None
              path = parsed.path
              if not path:
                  return None
              prefix = '/vertex-systems-ai.com/'
              if path.startswith(prefix):
                  return (root / path[len(prefix):]).resolve()
              if path == '/vertex-systems-ai.com':
                  return (root / 'index.html').resolve()
              if path.startswith('/'):
                  return None
              return (page.parent / path).resolve()

          for page in root.glob('*.html'):
              parser = RefParser()
              text = page.read_text(encoding='utf-8')
              parser.feed(text)
              for ref in parser.refs:
                  target = local_target(page, ref)
                  if target is None:
                      continue
                  checked += 1
                  try:
                      target.relative_to(root_abs)
                  except ValueError:
                      problems.append(f'{page}: reference escapes site root: {ref}')
                      continue
                  if target.is_dir():
                      target = target / 'index.html'
                  if not target.exists():
                      problems.append(f'{page}: missing local reference {ref} -> {target}')

          for css in root.glob('*.css'):
              text = css.read_text(encoding='utf-8')
              for raw in re.findall(r'url\(([^)]+)\)', text):
                  ref = raw.strip().strip('"\'')
                  if not ref or ref.startswith(('data:', 'http://', 'https://', '#')):
                      continue
                  target = (css.parent / ref.split('#')[0].split('?')[0]).resolve()
                  checked += 1
                  if not target.exists():
                      problems.append(f'{css}: missing CSS asset {ref}')

          protected = [
              'dashboard.html','projects.html','ai.html','robots.html','games.html','web.html',
              'space.html','minecraft.html','planets.html','stars.html','black-holes.html',
              'galaxies.html','moons.html','exploration.html','check.html'
          ]
          for name in protected:
              page = root / name
              if not page.exists():
                  problems.append(f'missing protected page: {name}')
                  continue
              text = page.read_text(encoding='utf-8')
              if 'src="auth.js"' not in text:
                  problems.append(f'{name}: auth.js is missing')
              if 'name="robots" content="noindex, nofollow"' not in text:
                  problems.append(f'{name}: noindex is missing')

          index = (root / 'index.html').read_text(encoding='utf-8')
          for token, label in [
              ('rel="canonical"', 'canonical'),
              ('property="og:image"', 'Open Graph image'),
              ('src="supabase-config.js"', 'Supabase config'),
              ('name="google-site-verification"', 'Google verification meta'),
          ]:
              if token not in index:
                  problems.append(f'index.html: missing {label}')

          for required in ['sitemap.xml', 'robots.txt', '404.html', 'googleeb6bb4ebc1c92cdc.html']:
              if not (root / required).exists():
                  problems.append(f'missing required file: {required}')

          print(f'Checked {checked} local references across the site.')
          if problems:
              print('\nAUDIT FAILED:')
              for item in problems:
                  print(' -', item)
              sys.exit(1)

          print('AUDIT PASSED: no missing local references or critical setup problems found.')
          PY
