name: Add Vertex Homepage Growth Script Once

on:
  push:
    paths:
      - '.github/workflows/add-site-growth-once.yml'

permissions:
  contents: write

jobs:
  add-growth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add share script to homepage
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CSS3/index.html')
          s = p.read_text(encoding='utf-8')
          tag = '<script src="site-growth.js?v=20260905-1"></script>'
          if tag not in s:
              s = s.replace('</body>', '    ' + tag + '\n\n</body>', 1)
              p.write_text(s, encoding='utf-8')
          PY
      - name: Commit homepage growth loader
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Load homepage share growth button"
            git push
          fi
