name: Add Vertex Analytics Tracker Once

on:
  push:
    paths:
      - '.github/workflows/add-analytics-tracker-once.yml'

permissions:
  contents: write

jobs:
  install-analytics:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Inject analytics tracker into site pages
        run: |
          python - <<'PY'
          from pathlib import Path

          tag = '<script src="site-analytics.js?v=20260905-1"></script>'
          changed = []
          for p in Path('CSS3').glob('*.html'):
              s = p.read_text(encoding='utf-8')
              if tag in s or '</body>' not in s:
                  continue
              s = s.replace('</body>', '    ' + tag + '\n</body>', 1)
              p.write_text(s, encoding='utf-8')
              changed.append(str(p))
          print('Updated:', ', '.join(changed) if changed else 'none')
          PY
      - name: Commit analytics tracker installation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/*.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Enable Vertex analytics across site pages"
            git push
          fi
