name: Fix Vertex SEO Homepage Once

on:
  push:
    paths:
      - '.github/workflows/seo-fix-once.yml'

permissions:
  contents: write

jobs:
  fix-seo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Fix canonical URLs and add discovery links
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('CSS3/index.html')
          s = p.read_text(encoding='utf-8')
          old = 'https://murad10867.github.io/vertex-systems-ai.com/'
          new = 'https://murad10867.github.io/www.vertex-systems-ai.com/'
          s = s.replace(old, new)
          marker = 'id="seo-discovery-links"'
          if marker not in s:
              block = '''\n<section id="seo-discovery-links" style="padding:52px 20px;text-align:center;position:relative;z-index:2">\n  <div style="max-width:1000px;margin:auto">\n    <p style="color:#38bdf8;letter-spacing:.12em">VERTEX AI</p>\n    <h2 style="font-size:32px;margin:8px 0 14px">اكتشف قدرات Vertex AI</h2>\n    <p style="color:#94a3b8;margin-bottom:24px">تعرّف على المحادثة العربية والصوت وتوليد الصور ومساعدة البرمجة.</p>\n    <div style="display:flex;gap:10px;justify-content:center;flex-wrap:wrap">\n      <a href="arabic-ai.html" style="padding:10px 14px;border:1px solid #243244;border-radius:12px;text-decoration:none;color:#dbeafe">ذكاء اصطناعي عربي</a>\n      <a href="arabic-ai-chat.html" style="padding:10px 14px;border:1px solid #243244;border-radius:12px;text-decoration:none;color:#dbeafe">شات AI عربي</a>\n      <a href="voice-ai.html" style="padding:10px 14px;border:1px solid #243244;border-radius:12px;text-decoration:none;color:#dbeafe">ذكاء اصطناعي بالصوت</a>\n      <a href="ai-image-generator.html" style="padding:10px 14px;border:1px solid #243244;border-radius:12px;text-decoration:none;color:#dbeafe">توليد الصور</a>\n      <a href="ai-programming-assistant.html" style="padding:10px 14px;border:1px solid #243244;border-radius:12px;text-decoration:none;color:#dbeafe">مساعد برمجة</a>\n    </div>\n  </div>\n</section>\n'''
              if '</main>' in s:
                  s = s.replace('</main>', block + '\n</main>', 1)
          p.write_text(s, encoding='utf-8')
          PY
      - name: Commit SEO homepage changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add CSS3/index.html
          if git diff --cached --quiet; then
            echo "No changes needed"
          else
            git commit -m "Fix homepage SEO URLs and add search landing links"
            git push
          fi
